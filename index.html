<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>TempGuard</title>
</head>
<body>
    <header>
        <div class="icon">
            <img src="/assets/air-conditioner.svg" alt="icon-dashboard">
        </div>
        <div class="title">
            <h1>TempGuard</h1>
        </div>
    </header>
    <main>
        <div class="info-air">
            <div class="temperature">
                <div class="card-top">
                    <img src="/assets/temperature.svg" alt="icon-thermometer">
                    <p><strong>Temperatura</strong></p>
                </div>
                <div class="temperature-number">
                    <p>26 °C</p>
                </div>
            </div>
            <div class="humidity">
                <div class="card-top">
                    <img src="/assets/humidity.svg" alt="icon-humidity">
                    <p><strong>Umidade</strong></p>
                </div>
                <div class="humidity-number">
                    <p>80%</p>
                </div>
            </div>
            <div class="quality">
                <div class="card-top">
                    <img src="/assets/quality.svg" alt="icon-quality-air">
                    <p><strong>Qualidade</strong></p>
                </div>
                <div class="quality-status">
                    <p>Boa</p>
                </div>
            </div>
        </div>
        <div class="controls">
            <input type="number" id="tempInput" placeholder="Temperatura">
            <input type="number" id="humInput" placeholder="Umidade">
            <input type="text" id="qualInput" placeholder="Qualidade">

            <button onclick="criarDados()">Criar</button>
            <button onclick="atualizarDados()">Atualizar</button>
            <button onclick="deletarDados()">Deletar</button>
        </div>           
    </main>
    
    <script type="module" src="index.js"></script>
</body>
</html>
